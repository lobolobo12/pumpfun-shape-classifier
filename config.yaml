# Single source of every knob. No magic numbers in src/.

# --- decision moment / label ----------------------------------------------
decision_mode: "age"         # "age": decide at launch + window_seconds; "cross": decide at the first trade
                             # after which the curve holds >= cross_level_sol real SOL (live-recognizable trigger)
cross_level_sol: 8.6
cross_min_age_seconds: 10  # a crossing younger than this is the launch bundle itself, not a crowd (handoff §3)
window_seconds: 300          # age mode: features see [launch, launch + window)
resample_steps: 300          # sequence steps over the window (1 s bins)
horizon_seconds: 3600        # barriers evaluated until entry + horizon
tp: 1.0                      # upper barrier: net exit >= cost * (1 + tp)
sl: 0.4                      # lower barrier: net exit <= cost * (1 - sl)
trailing_stop: false         # false: sl is from entry; true: sl is from the running peak of net exit
position_sol: 0.5            # hypothetical position, spent as buy_exact_sol_in
entry_lag_seconds: 0         # entry at launch + window + lag, on the curve state at that moment

# --- population the models train and score on ------------------------------
# "active": only coins still trading at the decision (last window trade within metrics.active_silence_max).
# Dead-at-entry coins are handled by that gate rule, not by the model. "all": the spec's full population.
population: "active"

# --- filters / sampling ---------------------------------------------------
min_trades_in_window: 10
neg_pos_ratio: 4             # negatives per positive in the TRAIN split only
zone_sol: [4, 30]            # the friends' zone (real SOL in curve at entry); reported as a slice

# --- dates / splits (launch day, in split_timezone) -----------------------
date_start: "2026-08-28"
date_end: "2026-12-31"     # open-ended: the daily cycle extends the universe; splits below pick the test day
split_train_end: "2026-09-03"
split_val_end: "2026-09-04"
split_timezone: "Europe/Ljubljana"

# --- costs (verified on mainnet, see nn-side-project-handoff.md and axiom-holy-sol/docs/pre-graduation.md)
fee_protocol_bps: 95         # curve: FeeConfig tier from zero mcap = protocol 95 + creator 30 = 125 bps/side
fee_creator_bps: 30
# Earlier eras (used by launch date; the current values above apply from the last entry onward).
# 2024: 1.00 % protocol, no creator fee. Approximate for pre-2025 coins — documented in the write-up.
fee_schedule:
  - from: "2024-01-01"
    protocol_bps: 100
    creator_bps: 0
  - from: "2025-05-01"
    protocol_bps: 95
    creator_bps: 30
pool_fee_bps:                # PumpSwap GlobalConfig; canonical pools may have mcap tiers (validated vs fillPriceSol)
  lp: 20
  protocol: 5
  creator: 5
router_fee_pct: 0.0          # Axiom-style router fee per side (friends preset: 0.01)
tx_fee_sol: 0.001            # base + priority fee per transaction, charged on entry and exit

# --- curve constants are DERIVED (label/curve_params.py) and asserted against these expectations
curve_expected:
  initial_virtual_sol_lamports: 30000000000
  initial_virtual_token_raw: 1073000000000000
  initial_real_token_raw: 793100000000000
  token_total_supply_raw: 1000000000000000
  token_decimals: 6
curve_param_tolerance: 0.02  # relative residual above which a coin is "non_standard" and dropped

# --- migration / PumpSwap seeding (observed constants, axiom-holy-sol BOOST)
migration:
  base_tokens_raw: 206900000000000
  quote_lamports: 84990360349
  virtual_quote_lamports: 17584505556

# --- data sources ---------------------------------------------------------
swap_api:
  base_url: "https://swap-api.pump.fun/v2/coins"
  user_agent: "pumpfun-shape-classifier/0.1 (research)"
  page_limit: 100
  rps_mac: 0.25
  rps_vps: 4.0
  slot_ms_estimate: 500      # over-estimate so the synthetic cursor lands AFTER the target
  horizon_margin_seconds: 120
  timeout_seconds: 20
  max_pages_per_coin: 80
sources:
  attention_db: "/Users/lovrobor/axiom-holy-sol/data/attention.db"
  pumpportal_raw: "/Users/lovrobor/axiom-holy-sol/data/raw/pumpportal"
  seed_trade_cache: "/Users/lovrobor/axiom-holy-sol/data/cache/pumpfun-trades"
universe:
  max_first_seen_age_seconds: 120   # a coin first seen older than this was not captured at birth
  coverage_min: 0.99                # sweep must contain this share of pumpportal create frames
prescreen:
  # Strata from the 20 s curve polls (nothing here looks at outcomes):
  #   candidate        the curve ever held enough SOL for a (1 + tp)x price from any entry, or graduated -> all
  #   unlikely_active  never did, but the curve's SOL changed after the window -> alive at entry -> all
  #   unlikely_quiet   never did and no change after the window (87 % dead) -> sampled
  #   unknown          no polls at all -> sampled
  # Sampled strata carry weight 1 / rate into every base rate and metric.
  sample_rate_unlikely_quiet: 0.2
  sample_rate_unknown: 0.2
  # Historical (source=bitquery) tokens have no curve polls; the screen is FDV >= fdv_candidate_usd
  # AND day high/low >= 1+tp over the first two days. Non-candidates are sampled.
  fdv_candidate_usd: 8000
  sample_rate_hist_candidate: 0.35  # historical candidates are plentiful (311k); a weighted sample is enough
  sample_rate_hist: 0.05

# --- benchmark ------------------------------------------------------------
bench:
  n_per_class: 100
  image_px: [640, 360]

# --- models ---------------------------------------------------------------
market_heat_window_hours: 6   # market_recent_tp_rate: TP rate of coins whose outcome resolved in this window before the entry
train:
  # How much a training example counts, by age relative to split_train_end:
  # weight = 0.5 ** (age_days / recency_half_life_days). 0 disables (all equal).
  recency_half_life_days: 7
  recent_only: false          # true: train on the live collector's eras only (ledger names get '+recent')
  # Training rows launched before this day are dropped (labels/features still built for them). May-June 2026
  # was a hot regime; cutting it measured best on Sep 4 (bot-live 0.262 -> 0.289) while keeping 4.7k rows.
  min_launch_day: "2026-07-01"
xgb:
  n_estimators: 600
  max_depth: 4
  learning_rate: 0.03
  subsample: 0.8
  colsample_bytree: 0.8
  early_stopping_rounds: 50
  bag_seeds: 5             # seeds averaged per variant (served xgb_botlive* always >= 5)
cnn:
  side: true               # feed the standardised tabular features next to the sequence; false = sequence only
  encoding: "steps"        # "steps" (spec: fixed 1 s bins) or "trades" (one step per trade, right-aligned)
  trade_steps: 256
  channels: 64
  blocks: 4
  kernel: 5
  dropout: 0.3
  epochs: 40
  batch_size: 256
  lr: 0.001
  patience: 6
  seeds: 5
  # After the main fit over all training data, fine-tune on the most recent N days at lr/5.
  # 0 disables. Only matters once historical data is in the training set.
  finetune_days: 4
  # Load the self-supervised trunk from `pf cnn-pretrain` (data/processed/cnn_pretrained_<encoding>.pt) when
  # true and the file exists; the classifier head always starts random.
  pretrained: false
  pretrain:
    horizons_s: [60, 600]  # regress log(curve SOL at cut+h / at cut) for each horizon
    cuts_per_tape: 3       # random decision moments per tape
    max_mints: 200000      # cap on tapes used (memory: cuts x 256 x 6 float32; 225k cuts ~ 1.4 GB)
    epochs: 20
botlive:
  # bot first-sight level sampled per coin for the truncated training view: scanner-seen coins (3-8 SOL)
  # and band-first coins (first sample at or after the 8.6 SOL crossing, cap 10), half each
  # empirical from the bot's nn_scores (252 crossings, 4-5 Sep): [lo, hi, count]
  # post-fix decided rows (32, 5 Sep 00:45-02:40 CEST) sit below 12 SOL; the earlier all-crossings histogram
  # was dominated by coins the bot had no launch record for. Reweighted toward what is actually decided.
  first_seen_sol: [[3.0, 8.6, 12], [8.6, 10.0, 15], [10.0, 12.0, 5], [12.0, 20.0, 2], [20.0, 40.0, 1]]
  # when true, a coin first seen above the crossing is labeled from its first-sight level (the bot's
  # actual decision moment) instead of from the 8.6 SOL crossing
  entry_at_first_sight: false
ensemble:
  # rank-average of these models' saved test scores (trained in the same run: same split and mode)
  members: ["xgb_botlive+context", "cnn_trades+side+pre", "xgb_all+wallets"]
metrics:
  top_fractions: [0.01, 0.05, 0.10]
  active_silence_max: 60   # "active at entry" slice: last window trade within this many seconds of the decision

paths:
  data: "data"
  reports: "reports"
seed: 42
