[project]
name = "pumpfun-shape-classifier"
version = "0.1.0"
description = "Predict early Pump.fun chart outcomes from the first N seconds of on-chain trading."
requires-python = ">=3.12,<3.13"
dependencies = [
    "polars>=1.20",
    "duckdb>=1.1",
    "pyarrow>=18",
    "httpx>=0.28",
    "pyyaml>=6",
    "numpy>=2",
]

[project.optional-dependencies]
# Only the Mac needs these; the fetch runners install the core set.
models = ["scikit-learn>=1.6", "xgboost>=2.1", "torch>=2.5", "matplotlib>=3.9"]

[project.scripts]
pf = "pumpfun.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pumpfun"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/pumpfun/bench/web_page.py" = ["E501"]  # an HTML/CSS template

[tool.pytest.ini_options]
testpaths = ["tests"]
